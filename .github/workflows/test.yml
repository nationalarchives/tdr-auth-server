name: TDR Run Auth Server Tests
on:
  push:
    branches-ignore:
      - master
      - release-*
permissions:
  id-token: write
  contents: write
jobs:
  test:
    uses: nationalarchives/tdr-github-actions/.github/workflows/tdr_test.yml@cd62f21505397a0dc62bda0384f0101f7ccaca2a # v0.0.54
    with:
      repo-name: tdr-auth-server
      test-command: |
        npm install
        npm run checks
        sbt test
      java-version: '17'
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
