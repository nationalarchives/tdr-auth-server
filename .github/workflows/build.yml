name: TDR Tag and pre deploy Auth Server
on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Build a dev snapshot from the current branch instead of the next release version'
        type: boolean
        required: false
        default: true
  push:
    branches:
      - master
permissions:
  contents: read
jobs:
  pre-deploy:
    permissions:
      id-token: write
      contents: write
    uses: nationalarchives/tdr-github-actions/.github/workflows/ecs_build.yml@f563794aa48b4ea16cae01caf704aa241a37539f # v.0.0.48
    with:
      repo-name: tdr-auth-server
      image-name: auth-server
      java-version: '21'
      snapshot: ${{ inputs.snapshot == true }}
      build-command: |
        npm install
        npm run build-theme
        wget --header "Authorization: token $GITHUB_TOKEN" https://raw.githubusercontent.com/nationalarchives/tdr-configurations/master/keycloak/tdr-realm-export.json
        sbt assembly
    secrets:
      MANAGEMENT_ACCOUNT: ${{ secrets.MANAGEMENT_ACCOUNT }}
      WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
      WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
      WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
      WIZ_PROJECT_ID: ${{ secrets.WIZ_PROJECT_TDR }}
  deploy:
    needs: pre-deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          if [ "$SNAPSHOT" = "true" ]; then
            gh workflow run deploy.yml -f environment=dev -f to-deploy=$NEXT_VERSION
          else
            gh workflow run deploy.yml -f environment=intg -f to-deploy=$NEXT_VERSION
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          NEXT_VERSION: ${{ needs.pre-deploy.outputs.next-version }}
          SNAPSHOT: ${{ inputs.snapshot == true }}
