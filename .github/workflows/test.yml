name: TDR Run Auth Server Tests
on:
  push:
    branches-ignore:
      - master
      - release-*
permissions:
  id-token: write
  contents: write
jobs:
  test:
    uses: nationalarchives/tdr-github-actions/.github/workflows/tdr_test.yml@b469512bc31f0425270a12b87ebe68807c3a1daf # v.0.0.46
    with:
      repo-name: tdr-auth-server
      test-command: |
        npm install
        npm run checks
        sbt test
      java-version: '17'
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
