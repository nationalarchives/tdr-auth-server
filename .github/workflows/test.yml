name: TDR Run Auth Server Tests
on:
  push:
    branches-ignore:
      - master
      - release-*
permissions:
  id-token: write
  contents: write
jobs:
  test:
    uses: nationalarchives/tdr-github-actions/.github/workflows/tdr_test.yml@fc52a93f9636579d7478f01a8a960007134ad30f # v.0.0.51
    with:
      repo-name: tdr-auth-server
      test-command: |
        npm install
        npm run checks
        sbt test
      java-version: '17'
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
