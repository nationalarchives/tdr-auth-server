name: TDR Tag and pre deploy Auth Server
on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Build a dev snapshot from the current branch instead of the next release version'
        type: boolean
        required: false
        default: false
      environment:
        type: choice
        description: 'Environment'
        required: true
        options:
          - intg
          - staging
          - prod
          - dev
          - drdev
        default: 'drdev'
  push:
    branches:
      - master
permissions:
  contents: read
jobs:
  pre-deploy:
    permissions:
      id-token: write
      contents: write
    uses: nationalarchives/tdr-github-actions/.github/workflows/ecs_build.yml@714115ab533f9f6b0b4fed5a4293e9d57c2b89d8 # v0.0.55
    with:
      repo-name: tdr-auth-server
      image-name: auth-server
      java-version: '21'
      snapshot: ${{ inputs.snapshot == true }}
      build-command: |
        npm install
        npm run build-theme
        wget --header "Authorization: token $GITHUB_TOKEN" https://raw.githubusercontent.com/nationalarchives/tdr-configurations/master/keycloak/tdr-realm-export.json
        sbt assembly
      environment: ${{ inputs.environment }}
    secrets:
      MANAGEMENT_ACCOUNT: ${{ secrets.MANAGEMENT_ACCOUNT }}
      WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
      WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
      WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
      WIZ_PROJECT_ID: ${{ secrets.WIZ_PROJECT_TDR }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      
  deploy:
    needs: pre-deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          gh workflow run deploy.yml --ref "$WORKFLOW_REF" \
            -f environment=drdev \
            -f to-deploy=$NEXT_VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          NEXT_VERSION: ${{ needs.pre-deploy.outputs.next-version }}
          SNAPSHOT: ${{ inputs.snapshot }}
          WORKFLOW_REF: ${{ github.ref_name }}
